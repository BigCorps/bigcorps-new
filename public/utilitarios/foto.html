<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duplicador de Fotos - BigCorps Tecnologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    html, body { height: 100%; overflow: hidden; }
    .iframe-page { height: 100vh; display: flex; flex-direction: column; }
    .iframe-bar {
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }
    .iframe-url {
      font-size: 0.78rem;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .iframe-url svg { color: var(--orange); }
    .iframe-wrap { flex: 1; overflow: hidden; }
    .iframe-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

    .iframe-tools { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tool-btn {
      padding: 0.45rem 0.9rem; font-size: 0.8rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.4rem;
      border-radius: 8px; border: 1px solid var(--gray-100);
      background: var(--white); color: var(--gray-500); transition: all 0.2s;
    }
    .tool-btn:hover { border-color: var(--orange); color: var(--orange); }
    .tool-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }
  </style>
  <meta name="description" content="Ferramenta gratuita para duplicar e organizar fotos em uma folha, direto no navegador. Sem cadastro e sem instalar nada.">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
  <link rel="canonical" href="https://bigcorps.com.br/utilitarios/foto">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BigCorps Tecnologia">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://bigcorps.com.br/utilitarios/foto">
  <meta property="og:title" content="Duplicador de Fotos Online e Gratuito — BigCorps">
  <meta property="og:description" content="Ferramenta gratuita para duplicar e organizar fotos em uma folha, direto no navegador. Sem cadastro e sem instalar nada.">
  <meta property="og:image" content="https://bigcorps.com.br/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Duplicador de Fotos Online e Gratuito — BigCorps">
  <meta name="twitter:description" content="Ferramenta gratuita para duplicar e organizar fotos em uma folha, direto no navegador. Sem cadastro e sem instalar nada.">
  <meta name="twitter:image" content="https://bigcorps.com.br/og-image.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "@id": "https://bigcorps.com.br/utilitarios/foto#app",
        "name": "Duplicador de Fotos",
        "url": "https://bigcorps.com.br/utilitarios/foto",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "inLanguage": "pt-BR",
        "browserRequirements": "Requer JavaScript",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        },
        "publisher": {
          "@id": "https://bigcorps.com.br/#organization"
        },
        "description": "Duplica uma foto várias vezes em uma folha para impressão, direto no navegador."
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Início",
            "item": "https://bigcorps.com.br/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Utilitários",
            "item": "https://bigcorps.com.br/utilitarios/idkey"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "Duplicador de Fotos",
            "item": "https://bigcorps.com.br/utilitarios/foto"
          }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <div class="iframe-page">
    <header>
      <div class="container">
        <div class="header-inner">
          <a href="/" class="logo"><img src="/logo.png" alt="BigCorps" height="24"></a>
          <button class="mobile-menu-btn" aria-label="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <nav>
            <ul>
              <li><a href="/">Início</a></li>
              <li><a href="/solucoes/">Soluções</a></li>
              <li><a href="/duvidas/">Dúvidas</a></li>
              <li><a href="/utilitarios/idkey" class="active">Utilitários</a></li>
              <li><a href="/contato/">Contato</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <div class="iframe-bar">
      <div class="iframe-url">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="bar-label">Duplicador de Imagens</span>
      </div>

      <div class="iframe-tools">
        <button data-tool="duplicador" onclick="switchTool('duplicador')" class="tool-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
          Duplicador
        </button>
        <button data-tool="fotos" onclick="switchTool('fotos')" class="tool-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h3M15 12h3M7 16h10"/></svg>
          Fotos 3x4
        </button>
        <button data-tool="polaroid" onclick="switchTool('polaroid')" class="tool-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="1"/><rect x="7" y="6" width="10" height="9"/></svg>
          Polaroid
        </button>
        <button data-tool="conversor" onclick="switchTool('conversor')" class="tool-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h12l-3-3M20 16H8l3 3"/></svg>
          Conversor
        </button>
      </div>
    </div>

    <div class="iframe-wrap">
      <iframe id="main-frame" src="https://home.bigcorps.com.br/duplicador.html" title="Duplicador de Imagens" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const TOOLS = {
      duplicador: { url: 'https://home.bigcorps.com.br/duplicador.html', label: 'Duplicador de Imagens' },
      fotos:      { url: 'https://home.bigcorps.com.br/fotos.html',      label: 'Fotos 3x4' },
      polaroid:   { url: 'https://home.bigcorps.com.br/polaroid.html',   label: 'Polaroid' },
      conversor:  { url: 'https://home.bigcorps.com.br/conversor.html',  label: 'Conversor de Arquivos' }
    };

    const frame    = document.getElementById('main-frame');
    const barLabel = document.getElementById('bar-label');

    function switchTool(key) {
      const tool = TOOLS[key];
      if (!tool) return;
      frame.src = tool.url;
      barLabel.textContent = tool.label;
      document.querySelectorAll('.tool-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.tool === key)
      );
    }

    // estado inicial
    switchTool('duplicador');
  </script>

  <script src="/js/main.js"></script>
</body>
</html>
