<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duplicador de Fotos - BigCorps Tecnologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    html, body { height: 100%; overflow: hidden; }
    .iframe-page { height: 100vh; display: flex; flex-direction: column; }
    .iframe-bar {
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }
    .iframe-url {
      font-size: 0.78rem;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .iframe-url svg { color: var(--orange); }
    .iframe-wrap { flex: 1; overflow: hidden; }
    .iframe-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div class="iframe-page">
    <header>
      <div class="container">
        <div class="header-inner">
          <a href="/" class="logo"><img src="/logo.png" alt="BigCorps" height="24"></a>
          <button class="mobile-menu-btn" aria-label="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <nav>
            <ul>
              <li><a href="/">Início</a></li>
              <li><a href="/solucoes/">Soluções</a></li>
              <li><a href="/duvidas/">Dúvidas</a></li>
              <li><a href="/utilitarios/idkey.html" class="active">Utilitários</a></li>
              <li><a href="/contato/">Contato</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <div class="iframe-bar">
      <div class="iframe-url">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Duplicador de Imagens:
      </div>

      <!-- Botão agora chama toggleIframe() em vez de abrir nova aba -->
      <button id="toggle-btn" onclick="toggleIframe()" class="btn btn-primary" style="padding:0.45rem 1rem;font-size:0.8rem;cursor:pointer;display:flex;align-items:center;gap:0.4rem;">
        <svg id="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        <span id="btn-text">Fotos 3x4</span>
      </button>
    </div>

    <div class="iframe-wrap">
      <iframe id="main-frame" src="https://inter.btsolucao.com.br" title="ID Key" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const IDKEY_URL   = 'https://home.bigcorps.com.br/duplicador.html';
    const TUTORIAL_URL = 'https://home.bigcorps.com.br/fotos.html';

    const frame   = document.getElementById('main-frame');
    const btn     = document.getElementById('toggle-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');

    // Ícone de "voltar" (seta circular)
    const iconBack = `<path d="M19 12A7 7 0 1 1 12 5V2l4 4-4 4V7a5 5 0 1 0 5 5z"/>`;
    // Ícone de "passo a passo" (relógio)
    const iconSteps = `<circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>`;

    let showingTutorial = false;

    function toggleIframe() {
      if (!showingTutorial) {
        // Abre o tutorial no iframe
        frame.src = TUTORIAL_URL;
        btnText.textContent = 'Fotos 3x4';
        btnIcon.innerHTML = iconBack;
        showingTutorial = true;
      } else {
        // Volta para o ID Key
        frame.src = IDKEY_URL;
        btnText.textContent = 'Duplicador de Imagens';
        btnIcon.innerHTML = iconSteps;
        showingTutorial = false;
      }
    }
  </script>

  <script src="/js/main.js"></script>
</body>
</html>
